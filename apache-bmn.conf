# Konfigurasi Apache VirtualHost untuk Aplikasi BMN
# File ini perlu ditempatkan di konfigurasi Apache server BMKG
#
# Untuk Ubuntu/Debian: /etc/apache2/sites-available/bmn.conf
# Untuk CentOS/RHEL: /etc/httpd/conf.d/bmn.conf
#
# Aktifkan modul yang diperlukan:
#   sudo a2enmod proxy proxy_http rewrite headers
#   sudo a2ensite bmn.conf
#   sudo systemctl restart apache2

<VirtualHost *:80>
    # Ganti dengan domain/IP server BMKG
    ServerName bmn.bmkg.go.id
    ServerAlias localhost

    # Proxy untuk Frontend (port 3022)
    ProxyPreserveHost On

    # API requests → Backend (port 8022)
    ProxyPass /api http://127.0.0.1:8022/api
    ProxyPassReverse /api http://127.0.0.1:8022/api

    # Uploaded files → Backend (port 8022)
    ProxyPass /uploads http://127.0.0.1:8022/uploads
    ProxyPassReverse /uploads http://127.0.0.1:8022/uploads

    # All other requests → Frontend (port 3022)
    ProxyPass / http://127.0.0.1:3022/
    ProxyPassReverse / http://127.0.0.1:3022/

    # Security Headers
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/bmn-error.log
    CustomLog ${APACHE_LOG_DIR}/bmn-access.log combined
</VirtualHost>
