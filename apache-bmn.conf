# Konfigurasi Apache VirtualHost untuk Aplikasi BMN PSIMKG
# Tempatkan file ini di: /etc/apache2/sites-available/bmn.conf
#
# Aktifkan konfigurasi dan modul di Ubuntu 24.04:
#   sudo a2enmod proxy proxy_http rewrite headers
#   sudo a2ensite bmn.conf
#   sudo systemctl restart apache2

<VirtualHost *:80>
    ServerName bmn.bmkg.go.id
    ServerAlias localhost

    ProxyPreserveHost On

    # 1. Reverse Proxy ke subpath /bmn (Deployment server BMKG)
    ProxyPass /bmn/api http://127.0.0.1:8022/api
    ProxyPassReverse /bmn/api http://127.0.0.1:8022/api

    ProxyPass /bmn/uploads http://127.0.0.1:8022/uploads
    ProxyPassReverse /bmn/uploads http://127.0.0.1:8022/uploads

    ProxyPass /bmn http://127.0.0.1:3022/bmn
    ProxyPassReverse /bmn http://127.0.0.1:3022/bmn

    # 2. Reverse Proxy untuk root domain / localhost
    ProxyPass /api http://127.0.0.1:8022/api
    ProxyPassReverse /api http://127.0.0.1:8022/api

    ProxyPass /uploads http://127.0.0.1:8022/uploads
    ProxyPassReverse /uploads http://127.0.0.1:8022/uploads

    ProxyPass / http://127.0.0.1:3022/
    ProxyPassReverse / http://127.0.0.1:3022/

    # Security Headers
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/bmn-error.log
    CustomLog ${APACHE_LOG_DIR}/bmn-access.log combined
</VirtualHost>
